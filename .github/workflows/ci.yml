name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.14"
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check src tests scripts
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m compileall -q src
      - run: uv run --locked python scripts/check_public_tree.py
      - run: node --check site/app.js
      - run: docker build -t google-health-mcp:check .

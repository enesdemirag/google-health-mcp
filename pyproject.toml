[project]
name = "google-health-mcp"
version = "0.1.0"
description = "Unofficial, read-only Google Health MCP server with per-user Google OAuth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "cryptography>=44,<50",
    "py-key-value-aio[disk,wrappers-encryption]>=0.4.6,<1",
]

[project.scripts]
google-health-mcp = "google_health_mcp.__main__:main"

[project.urls]
Homepage = "https://enesdemirag.github.io/google-health-mcp/"
Repository = "https://github.com/enesdemirag/google-health-mcp"
Issues = "https://github.com/enesdemirag/google-health-mcp/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_health_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
